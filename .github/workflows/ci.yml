name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:

  # ─────────────────────────────────────────────
  # Job 1: Lint & Code Quality
  # Catches bad code before it wastes test time
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint user-service
        run: flake8 services/user-service/main.py --max-line-length=100

      - name: Lint order-service
        run: flake8 services/order-service/main.py --max-line-length=100

  # ─────────────────────────────────────────────
  # Job 2: Unit Tests
  # Runs pytest for each service in parallel
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint        # Only runs if lint passes

    strategy:
      matrix:
        service: [user-service, order-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run tests with coverage
        run: |
          cd services/${{ matrix.service }}
          pytest test_main.py -v --cov=. --cov-report=term-missing

  # ─────────────────────────────────────────────
  # Job 3: Security Scan
  # Scans Python code for vulnerabilities
  # ─────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint        # Runs in parallel with test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit

      - name: Scan user-service
        run: bandit -r services/user-service/main.py -ll

      - name: Scan order-service
        run: bandit -r services/order-service/main.py -ll

  # ─────────────────────────────────────────────
  # Job 4 & 5: Docker Build & Push to ECR
  # Only runs on push to main (not PRs)
  # ─────────────────────────────────────────────
  build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, security]   # Only runs if BOTH pass

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & push api-gateway
        run: |
          docker build -t $ECR_REGISTRY/api-gateway:${{ steps.vars.outputs.IMAGE_TAG }} \
                       -t $ECR_REGISTRY/api-gateway:latest \
                       services/api-gateway
          docker push $ECR_REGISTRY/api-gateway:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push $ECR_REGISTRY/api-gateway:latest

      - name: Build & push user-service
        run: |
          docker build -t $ECR_REGISTRY/user-service:${{ steps.vars.outputs.IMAGE_TAG }} \
                       -t $ECR_REGISTRY/user-service:latest \
                       services/user-service
          docker push $ECR_REGISTRY/user-service:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push $ECR_REGISTRY/user-service:latest

      - name: Build & push order-service
        run: |
          docker build -t $ECR_REGISTRY/order-service:${{ steps.vars.outputs.IMAGE_TAG }} \
                       -t $ECR_REGISTRY/order-service:latest \
                       services/order-service
          docker push $ECR_REGISTRY/order-service:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push $ECR_REGISTRY/order-service:latest

      - name: Build & push frontend
        run: |
          docker build -t $ECR_REGISTRY/frontend:${{ steps.vars.outputs.IMAGE_TAG }} \
                       -t $ECR_REGISTRY/frontend:latest \
                       services/frontend
          docker push $ECR_REGISTRY/frontend:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push $ECR_REGISTRY/frontend:latest

      - name: Print image tags
        run: |
          echo "Images pushed with tag: ${{ steps.vars.outputs.IMAGE_TAG }}"
          echo "ECR Registry: $ECR_REGISTRY"