global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:80']
    metrics_path: /health

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8001']
    metrics_path: /health

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8002']
    metrics_path: /health